[platformio]
default_envs = esp32s3-n16r8   ; ปุ่ม Upload ปกติ = โปรแกรมหลัก

[env:esp32s3-n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; ESP32-S3-WROOM-1 N16R8: Flash 16MB QIO + PSRAM 8MB OPI
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 9600
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0     ; Serial ออกทางช่อง UART (COM) / ถ้าใช้ OTG ให้เป็น 1
  -DCORE_DEBUG_LEVEL=0            ; ปิด log ระบบ (ส่งงาน) / ใช้ 3 ตอน debug

build_src_filter = +<*> -<calib.cpp> -<moisture.cpp> -<c0.cpp> -<hello_mqtt.cpp>   ; โปรแกรมหลัก (ไม่รวมโหมดปรับเทียบ)

lib_deps =
  knolleary/PubSubClient
  bblanchon/ArduinoJson@^7

; ===== build พิเศษสำหรับหา gain / offset =====
; อัปโหลด: pio run -e calib -t upload   แล้วเปิด monitor
[env:calib]
extends = env:esp32s3-n16r8
build_src_filter = +<*> -<main.cpp> -<moisture.cpp> -<c0.cpp> -<hello_mqtt.cpp>

; ===== วันที่ 2: เครื่องวัดความชื้นเมล็ดกาแฟ =====
; อัปโหลด: pio run -e moisture -t upload   แล้วเปิด monitor
[env:moisture]
extends = env:esp32s3-n16r8
build_src_filter = +<*> -<main.cpp> -<calib.cpp> -<c0.cpp> -<hello_mqtt.cpp>
monitor_filters = esp32_exception_decoder, time, log2file   ; บันทึก Serial ลงโฟลเดอร์ logs/

; ===== หา C0 (C กล่องเปล่า) ให้ moisture.cpp =====
; อัปโหลด: pio run -e c0 -t upload   แล้วเปิด monitor → กดปุ่มกับกล่องเปล่า 5–6 ครั้ง
[env:c0]
extends = env:esp32s3-n16r8
build_src_filter = -<*> +<c0.cpp> +<cap_meter.cpp>
monitor_filters = esp32_exception_decoder, time, log2file

; ===== ทดสอบ MQTT: ส่ง hello ไป TGR-17/hello ทุก 5 s (WiFi/broker ใน include/secrets.h) =====
; อัปโหลด: pio run -e hello -t upload   แล้วเปิด monitor
[env:hello]
extends = env:esp32s3-n16r8
build_src_filter = -<*> +<hello_mqtt.cpp> +<MqttManager.cpp>
